# Hardened local OpenTelemetry Collector configuration.
#
# Scope and honesty notes (see docs/observability-and-slos.md and
# docs/telemetry-semantic-conventions.md for the full contract):
#   - This file is a local, loopback-bound learning topology. It is not a
#     production collector deployment.
#   - As of this layer, `src/aegis_agent_platform` depends only on
#     `opentelemetry-api`, not an SDK exporter package, so no span or metric
#     currently leaves the process. This collector config is the target
#     pipeline for when SDK wiring lands; until then every receiver here is
#     idle and every dashboard/alert built against it reads "no data" rather
#     than a false signal.
#   - TLS and authentication are a documented production boundary, not
#     implemented here. See the "Production TLS/auth boundary" note below.
#
# Processor order is deliberate and must not be reordered:
#   memory_limiter (fail closed before anything else does work)
#     -> resource (normalize service/environment/schema identity)
#     -> transform/redaction/filter (delete or drop forbidden attributes)
#     -> batch (bound outbound request size/rate last)

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /health

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Fail closed under memory pressure before any other processor runs.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  # Resource normalization: stamp a stable service/schema identity and strip
  # host-identifying resource attributes that are not needed for correlation
  # and would otherwise widen cardinality or leak deployment topology.
  resource:
    attributes:
      - key: service.namespace
        value: aegis
        action: upsert
      - key: aegis.telemetry.schema_version
        value: aegis.telemetry.v1
        action: upsert
      - key: deployment.environment.name
        value: ${env:AEGIS_ENVIRONMENT:-local}
        action: upsert
      - key: process.command_line
        action: delete
      - key: process.executable.path
        action: delete
      - key: process.owner
        action: delete
      - key: host.name
        action: delete
      - key: net.host.name
        action: delete

  # Attribute deletion/redaction: remove every attribute this platform treats
  # as forbidden on telemetry (tenant, user, run, incident, artifact, target
  # identifiers, and any free-text/content-shaped field) from every signal.
  # This is defense in depth; the primary control is that instrumentation
  # code never constructs these attributes (see AgentTracer/GatewayTracer/
  # SandboxTracer/RemediationTracer/EvidenceTracer/RuntimeTracer, which accept
  # only fixed operation/role/source/model/purpose/action-kind values).
  transform:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_matching_keys(span.attributes, "^(aegis\\.(tenant|user|run|investigation|incident|artifact|target|approval|action|sandbox\\.request|memory\\.(candidate|chunk))\\.id)$")
          - delete_matching_keys(span.attributes, "(?i)(tenant_id|user_id|run_id|incident_id|artifact_id|target_id|approval_id|prompt|completion|evidence_body|runbook_body|request_body|response_body)")
          - delete_matching_keys(span.attributes, "(?i)(authorization|cookie|api[_-]?key|secret|password|token)$")
          - delete_key(span.attributes, "db.statement")
          - delete_key(span.attributes, "http.request.header.authorization")
          - delete_key(span.attributes, "url.query")
    metric_statements:
      - context: datapoint
        statements:
          - delete_matching_keys(datapoint.attributes, "^(aegis\\.(tenant|user|run|investigation|incident|artifact|target|approval|action|sandbox\\.request|memory\\.(candidate|chunk))\\.id)$")
          - delete_matching_keys(datapoint.attributes, "(?i)(tenant_id|user_id|run_id|incident_id|artifact_id|target_id|approval_id)")
    log_statements:
      - context: log
        statements:
          - delete_matching_keys(log.attributes, "^(aegis\\.(tenant|user|run|investigation|incident|artifact|target|approval|action|sandbox\\.request|memory\\.(candidate|chunk))\\.id)$")
          - delete_matching_keys(log.attributes, "(?i)(tenant_id|user_id|run_id|incident_id|artifact_id|target_id|approval_id|prompt|completion)")

  # Trace-only allowlist-style redaction as a second, independent control on
  # top of `transform`. `allowed_keys` is intentionally the bounded catalog
  # from docs/telemetry-semantic-conventions.md; anything else is stripped
  # even if a future code change accidentally starts emitting it.
  redaction:
    allow_all_keys: false
    allowed_keys:
      - aegis.agent.role
      - aegis.evidence.source
      - aegis.action.kind
      - aegis.sandbox.purpose
      - aegis.telemetry.schema_version
      - eval.run_fingerprint
      - eval.mode
      - gen_ai.provider.name
      - gen_ai.request.model
      - service.name
      - service.namespace
      - service.version
      - deployment.environment.name
      - otel.status_code
      - otel.status_description
    blocked_values:
      - '[A-Za-z0-9-_]{20,}\.[A-Za-z0-9-_]{20,}\.[A-Za-z0-9-_]{20,}' # JWT-shaped
      - 'sk-[A-Za-z0-9]{20,}' # provider API key shapes
    summary: debug

  # Bounded batching is the last processor so every earlier stage already
  # ran on the smallest possible unit of data.
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  # Metrics: pulled by Prometheus. This is the only exporter enabled by
  # default end-to-end in the local topology (see deploy/prometheus.yml).
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: false
    enable_open_metrics: true

  # Traces and logs: pushed via OTLP to an operator-supplied backend. No such
  # backend (e.g. Tempo/Jaeger, Loki) is deployed by this repository's
  # Compose topology, so this endpoint is a placeholder by default and the
  # queue below will bound, retry, and eventually drop, rather than block.
  #
  # Production TLS/auth boundary (not configured here):
  #   - Set `tls.insecure: false` and provide `tls.ca_file`/`cert_file`/
  #     `key_file`, or terminate TLS at a sidecar/mesh.
  #   - Add an auth extension (for example `bearertokenauth` or
  #     `basicauth`) to `otlphttp.auth` and reference a secret-broker-backed
  #     credential, never a static value in this file.
  #   - Do the same for the `otlp` receiver above in production: require
  #     client TLS/auth so an untrusted network peer cannot inject spans,
  #     metrics, or logs.
  otlphttp/traces_logs:
    endpoint: ${env:AEGIS_OTLP_TRACES_LOGS_ENDPOINT:-http://127.0.0.1:4319}
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 2000
      # In-memory only: a collector restart drops whatever is still queued.
      # A production deployment that needs delivery across a collector
      # restart must add the `file_storage` extension and set
      # `sending_queue.storage` to it with a persistent volume; this local
      # topology has no such volume, so persistence is intentionally not
      # enabled here rather than silently claimed.

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, transform, redaction, batch]
      exporters: [otlphttp/traces_logs]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, transform, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, transform, batch]
      exporters: [otlphttp/traces_logs]
