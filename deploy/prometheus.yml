# Local Prometheus configuration.
#
# Honesty note (see docs/observability-and-slos.md): the rule files referenced
# below define the *target* recording/alerting contract for the metric names
# in docs/telemetry-semantic-conventions.md. As of this layer, application
# code depends only on `opentelemetry-api` with no configured SDK exporter, so
# the `otel-collector` job has nothing to scrape yet and every rule evaluates
# against absent series. That is expected locally: it is a deploy scaffold to
# validate now and wire application metrics into later, not a claim of live
# production data or attainment. See deploy/README.md for the additional
# Compose volume mount this repository's compose.yaml needs before Prometheus
# can load `rules/*.yml` (that mount is intentionally out of scope for this
# docs/deploy-only change and is expected to land alongside compose.yaml
# updates from concurrent work).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
