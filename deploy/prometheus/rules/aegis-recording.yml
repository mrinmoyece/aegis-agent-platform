groups:
  - name: aegis.sli.v1
    interval: 30s
    rules:
      - record: aegis:sli_api_error_ratio:rate5m
        expr: |
          sum(rate(aegis_api_requests_total{aegis_status=~"failed|timed_out"}[5m]))
          /
          clamp_min(sum(rate(aegis_api_requests_total[5m])), 1)
      - record: aegis:sli_api_error_ratio:rate1h
        expr: |
          sum(rate(aegis_api_requests_total{aegis_status=~"failed|timed_out"}[1h]))
          /
          clamp_min(sum(rate(aegis_api_requests_total[1h])), 1)
      - record: aegis:sli_api_error_ratio:rate6h
        expr: |
          sum(rate(aegis_api_requests_total{aegis_status=~"failed|timed_out"}[6h]))
          /
          clamp_min(sum(rate(aegis_api_requests_total[6h])), 1)
      - record: aegis:sli_api_error_ratio:rate3d
        expr: |
          sum(rate(aegis_api_requests_total{aegis_status=~"failed|timed_out"}[3d]))
          /
          clamp_min(sum(rate(aegis_api_requests_total[3d])), 1)
      - record: aegis:sli_api_error_ratio:rate30d
        expr: |
          sum(rate(aegis_api_requests_total{aegis_status=~"failed|timed_out"}[30d]))
          /
          clamp_min(sum(rate(aegis_api_requests_total[30d])), 1)
      - record: aegis:sli_work_fresh_ratio:rate5m
        expr: |
          sum(rate(aegis_worker_outcomes_total{aegis_work_state="succeeded"}[5m]))
          /
          clamp_min(sum(rate(aegis_worker_outcomes_total[5m])), 1)
      - record: aegis:sli_action_verified_ratio:rate1h
        expr: |
          sum(rate(aegis_action_verification_total{aegis_status="succeeded"}[1h]))
          /
          clamp_min(sum(rate(aegis_action_verification_total[1h])), 1)
      - record: aegis:sli_sandbox_cleanup_ratio:rate1h
        expr: |
          sum(rate(aegis_sandbox_cleanup_total{aegis_status="succeeded"}[1h]))
          /
          clamp_min(sum(rate(aegis_sandbox_cleanup_total[1h])), 1)
      - record: aegis:sli_memory_retrieval_success_ratio:rate1h
        expr: |
          sum(rate(aegis_memory_cache_outcomes_total{aegis_status="succeeded"}[1h]))
          /
          clamp_min(sum(rate(aegis_memory_cache_outcomes_total[1h])), 1)
