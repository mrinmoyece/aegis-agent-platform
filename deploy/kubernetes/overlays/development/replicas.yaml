apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-api
  namespace: aegis-system
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-operator-ui
  namespace: aegis-system
spec:
  replicas: 1
---
# The base HPA has minReplicas: 3; patch it to 1 so the Deployment replica
# count above is not immediately overridden by the autoscaler in development.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aegis-api
  namespace: aegis-system
spec:
  minReplicas: 1
  maxReplicas: 1
