apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: aegis-system
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-data-services
  namespace: aegis-system
  annotations:
    aegis.dev/managed-data-boundary: network-policy-data-cidr-plus-aws-security-group
spec:
  podSelector:
    matchExpressions:
      - key: aegis.dev/process-class
        operator: In
        values: [api, bff, worker, publisher, reconciler, protocol-gateway]
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 10.42.128.0/17
        - namespaceSelector:
            matchLabels:
              aegis.dev/network-zone: data
          podSelector:
            matchLabels:
              aegis.dev/data-service: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 10.42.128.0/17
        - namespaceSelector:
            matchLabels:
              aegis.dev/network-zone: data
          podSelector:
            matchLabels:
              aegis.dev/data-service: redis
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-migration-postgresql
  namespace: aegis-system
  annotations:
    aegis.dev/managed-data-boundary: network-policy-data-cidr-plus-aws-security-group
spec:
  podSelector:
    matchLabels:
      aegis.dev/process-class: migration
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 10.42.128.0/17
        - namespaceSelector:
            matchLabels:
              aegis.dev/network-zone: data
          podSelector:
            matchLabels:
              aegis.dev/data-service: postgresql
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgresql-from-system
  namespace: aegis-data
spec:
  podSelector:
    matchLabels:
      aegis.dev/data-service: postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              aegis.dev/network-zone: application
          podSelector:
            matchExpressions:
              - key: aegis.dev/process-class
                operator: In
                values:
                  [api, bff, worker, publisher, reconciler, protocol-gateway, migration]
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
