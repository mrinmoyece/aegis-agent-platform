apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-approved-external-egress
  namespace: aegis-system
  annotations:
    aegis.dev/intent: oidc-provider-connectors-and-protocol-peers-via-egress-gateway
spec:
  podSelector:
    matchExpressions:
      - key: aegis.dev/process-class
        operator: In
        values: [api, bff, worker, publisher, reconciler, protocol-gateway]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              aegis.dev/network-zone: egress
          podSelector:
            matchLabels:
              app.kubernetes.io/name: aegis-egress-gateway
      ports:
        - protocol: TCP
          port: 8443
---
