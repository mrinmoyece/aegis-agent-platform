apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-outbox-publisher
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-outbox-publisher
    aegis.dev/process-class: publisher
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis-outbox-publisher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis-outbox-publisher
        aegis.dev/process-class: publisher
      annotations:
        aegis.dev/coordination: postgres-skip-locked-claims
    spec:
      serviceAccountName: aegis-worker
      automountServiceAccountToken: false
      priorityClassName: aegis-control-plane
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aegis-outbox-publisher
      containers:
        - name: publisher
          image: aegis-control-plane
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: aegis-runtime
            - secretRef:
                name: aegis-runtime
          env:
            - name: AEGIS_SERVICE_NAME
              value: aegis-outbox-publisher
            - name: AEGIS_PROCESS_ROLE
              value: outbox-publisher
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /tmp/aegis-ready"]
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /tmp/aegis-ready"]
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "kill -0 1"]
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command:
                  ["/bin/sh", "-c", "rm -f /tmp/aegis-ready; sleep 45"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
