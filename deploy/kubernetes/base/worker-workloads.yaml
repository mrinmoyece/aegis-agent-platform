apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-worker-general
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-worker-general
    aegis.dev/process-class: worker
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis-worker-general
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis-worker-general
        aegis.dev/process-class: worker
      annotations:
        aegis.dev/readiness-gate: provider-adapter-and-handler-registry
    spec:
      serviceAccountName: aegis-worker
      automountServiceAccountToken: false
      priorityClassName: aegis-workers
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aegis-worker-general
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aegis-worker-general
      containers:
        - name: worker
          image: aegis-control-plane
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: aegis-runtime
            - secretRef:
                name: aegis-runtime
          env:
            - name: AEGIS_SERVICE_NAME
              value: aegis-worker-general
            - name: AEGIS_PROCESS_ROLE
              value: worker-general
            - name: AEGIS_WORKER_DRAIN_SECONDS
              value: "75"
          ports:
            - name: health
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health/live
              port: health
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 75"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
