apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aegis-aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aegis-runtime
  namespace: aegis-system
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aegis-aws-secrets-manager
  target:
    name: aegis-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AEGIS_DATABASE_URL
      remoteRef:
        key: /aegis/production/database
        property: url
    - secretKey: AEGIS_REDIS_URL
      remoteRef:
        key: /aegis/production/redis
        property: url
    - secretKey: AEGIS_SIGNING_KEY_REFERENCE
      remoteRef:
        key: /aegis/production/keys
        property: signing_reference
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aegis-ingress-tls
  namespace: aegis-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aegis-aws-secrets-manager
  target:
    name: aegis-ingress-tls
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: /aegis/production/ingress-tls
        property: certificate_chain
    - secretKey: tls.key
      remoteRef:
        key: /aegis/production/ingress-tls
        property: private_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aegis-writer-fences
  namespace: aegis-system
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aegis-aws-secrets-manager
  target:
    name: aegis-writer-fences
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: writer-fences.json
      remoteRef:
        key: /aegis/production/writer-fences
        property: tenant_credentials_json
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aegis-migration
  namespace: aegis-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aegis-aws-secrets-manager
  target:
    name: aegis-migration
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: AEGIS_MIGRATION_DATABASE_URL
      remoteRef:
        key: /aegis/production/database
        property: maintenance_url
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-runtime
  namespace: aegis-system
data:
  AEGIS_ENVIRONMENT: production
  AEGIS_HOST: 0.0.0.0
  AEGIS_PORT: "8080"
  AEGIS_LOG_LEVEL: INFO
  AEGIS_OIDC_ISSUER: https://identity.example.invalid/realms/aegis
  AEGIS_OIDC_JWKS_URL: https://identity.example.invalid/realms/aegis/certs
  AEGIS_OIDC_AUDIENCE: aegis-control-plane
  AEGIS_CREDENTIAL_PROVIDER: external-secrets
  AEGIS_SCHEMA_MIN_VERSION: "11"
  AEGIS_SCHEMA_MAX_VERSION: "11"
  AEGIS_WRITER_FENCES_FILE: /var/run/secrets/aegis/writer-fences.json
  AEGIS_PROTOCOL_GATEWAY_ENABLED: "false"
  AEGIS_SANDBOX_EXECUTION_ENABLED: "false"
  AEGIS_REDIS_MAX_CONNECTIONS: "32"
  AEGIS_WORKER_MAX_CONCURRENCY: "16"
  AEGIS_WORKER_LEASE_SECONDS: "30"
  AEGIS_WORKER_HEARTBEAT_SECONDS: "10"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://aegis-otel-collector.aegis-system.svc:4317
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production,service.namespace=aegis,cloud.region=eu-west-1
