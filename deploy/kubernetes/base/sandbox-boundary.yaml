apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: aegis-sandbox
handler: runsc
scheduling:
  nodeSelector:
    aegis.dev/node-pool: sandbox
  tolerations:
    - key: aegis.dev/sandbox
      operator: Equal
      value: "true"
      effect: NoSchedule
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-quota
  namespace: aegis-sandbox
spec:
  hard:
    pods: "50"
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    requests.ephemeral-storage: 50Gi
    limits.ephemeral-storage: 100Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-defaults
  namespace: aegis-sandbox
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 256Mi
      default:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: aegis-sandbox-conformance-template
  namespace: aegis-sandbox
  labels:
    app.kubernetes.io/name: aegis-sandbox
    aegis.dev/template-only: "true"
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis-sandbox
    spec:
      restartPolicy: Never
      serviceAccountName: aegis-sandbox-runner
      automountServiceAccountToken: false
      runtimeClassName: aegis-sandbox
      priorityClassName: aegis-sandbox
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: aegis.dev/sandbox
          operator: Equal
          value: "true"
          effect: NoSchedule
      nodeSelector:
        aegis.dev/node-pool: sandbox
      containers:
        - name: sandbox
          image: aegis-control-plane
          command: [python, -c, "raise SystemExit('template only')"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: work
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
