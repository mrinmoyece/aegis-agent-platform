apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-api
  namespace: aegis-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-worker
  namespace: aegis-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-migrator
  namespace: aegis-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-operator-ui
  namespace: aegis-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-otel
  namespace: aegis-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-sandbox-runner
  namespace: aegis-sandbox
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-sandbox-cleanup
  namespace: aegis-sandbox
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-cleanup
  namespace: aegis-sandbox
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-cleanup
  namespace: aegis-sandbox
subjects:
  - kind: ServiceAccount
    name: aegis-sandbox-cleanup
    namespace: aegis-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-cleanup
