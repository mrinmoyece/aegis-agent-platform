[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aegis-agent-platform"
version = "0.1.0"
description = "Learning platform for production-grade, multi-tenant agent operations"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aegis Agent Platform contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=45,<49",
  "psycopg[binary]>=3.2.9,<4",
  "pyjwt>=2.10,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pyyaml>=6.0.2,<7",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
]

[project.urls]
Repository = "https://github.com/mrinmoyece/aegis-agent-platform"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_agent_platform"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["A", "ANN", "B", "C4", "E", "F", "I", "N", "PERF", "PIE", "PT", "PTH", "RUF", "S", "SIM", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["ANN401"]
"tests/**" = ["ANN201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
warn_unreachable = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]
markers = [
  "integration: requires a live PostgreSQL test database",
]

[tool.coverage.run]
branch = true
source = ["aegis_agent_platform"]
omit = [
  "src/aegis_agent_platform/event_store/postgres.py",
  "src/aegis_agent_platform/persistence/postgres.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
