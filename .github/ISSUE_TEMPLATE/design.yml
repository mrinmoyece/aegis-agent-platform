name: Design proposal
description: Propose a bounded capability or architecture decision
title: "[Design]: "
labels: ["design"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operational problem without prescribing a solution.
    validations:
      required: true
  - type: textarea
    id: invariant
    attributes:
      label: Relevant invariants and threats
      description: Reference AGENTS.md, the threat model, or an ADR.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed layer and acceptance evidence
      description: State the roadmap layer and how implementation will be proven.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
