name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  quality:
    name: Python, tests, and docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install project
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Run fast checks
        run: make check
      - name: Audit Python dependencies and licenses
        run: make dependency-audit

  evaluation-gates:
    name: Deterministic safety and recovery gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install project
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Verify governed fixtures
        run: make eval-fixtures
      - name: Gate adversarial safety cases
        run: make eval-adversarial
      - name: Gate deterministic recovery cases
        run: make eval-recovery
      - name: Gate reviewed baseline
        run: make eval-baseline
      - name: Test the evaluator
        run: make eval-meta
      - name: Retain bounded redacted reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deterministic-evaluation-reports
          path: .aegis-evals/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  operator-ui:
    name: Operator UI security, accessibility, and journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.10.0"
      - name: Install pinned package manager
        run: npm install --global pnpm@11.21.0
      - name: Install locked dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Run frontend gates
        run: pnpm --dir frontend check
      - name: Audit production dependencies
        run: pnpm --dir frontend audit
      - name: Install bounded browser runtime
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Run deterministic operator journeys
        run: pnpm --dir frontend e2e
      - name: Retain failure-only browser evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operator-ui-playwright-failures
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain frontend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operator-ui-sbom
          path: frontend/dist/operator-ui.sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose model
        run: docker compose --env-file .env.example config --quiet

  postgres-redis-integration:
    name: PostgreSQL and Redis delivery races
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_DB: aegis_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aegis_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      redis:
        image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      AEGIS_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      AEGIS_TEST_DATABASE_URL: >-
        postgresql://postgres:local-ci-only@127.0.0.1:5432/aegis_test
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install project
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Exercise live delivery, lease, and storage controls
        run: make integration-test
      - name: Exercise evaluation-relevant persistence modes
        run: make eval-integration

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Dockerfile
        run: docker build --check .
      - name: Build application image
        run: docker build --tag aegis-agent-platform:${{ github.sha }} .
      - name: Validate operator Dockerfile
        run: docker build --check frontend
      - name: Build operator image
        run: docker build --tag aegis-operator-ui:${{ github.sha }} frontend
      - name: Smoke non-root operator image
        run: |
          container_id="$(
            docker run --detach --rm \
              --read-only \
              --tmpfs /tmp:size=16m \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --publish 127.0.0.1:4173:8080 \
              "aegis-operator-ui:${GITHUB_SHA}"
          )"
          trap 'docker stop "${container_id}" >/dev/null' EXIT
          test "$(docker inspect --format '{{.Config.User}}' "${container_id}")" = "101:101"
          ready=false
          for _ in 1 2 3 4 5 6; do
            if curl --fail --silent http://127.0.0.1:4173/healthz | grep --quiet ready; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "${ready}" != "true" ]; then
            docker logs "${container_id}"
            exit 1
          fi
          headers="$(curl --fail --silent --head http://127.0.0.1:4173/)"
          printf '%s\n' "${headers}" | grep --ignore-case --quiet '^Content-Security-Policy:'
          printf '%s\n' "${headers}" | grep --ignore-case --quiet '^Cache-Control: no-store'
