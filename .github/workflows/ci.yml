name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python, tests, and docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run fast checks
        run: make check

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose model
        run: docker compose --env-file .env.example config --quiet

  postgres-integration:
    name: PostgreSQL migrations, RLS, and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aegis_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aegis_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      AEGIS_TEST_DATABASE_URL: >-
        postgresql://postgres:local-ci-only@127.0.0.1:5432/aegis_test
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Exercise live durable-storage controls
        run: python -m pytest tests/integration

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Dockerfile
        run: docker build --check .
      - name: Build application image
        run: docker build --tag aegis-agent-platform:${{ github.sha }} .
