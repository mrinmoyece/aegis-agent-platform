name: Supply chain

on:
  pull_request:
    paths:
      - ".github/workflows/supply-chain.yml"
      - "Dockerfile"
      - "frontend/**"
      - "pyproject.toml"
      - "requirements*.lock"
      - "scripts/check_license_policy.py"
      - "scripts/check_vulnerability_policy.py"
      - "src/**"
      - "security/vulnerability-waivers.yaml"
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APPLICATION_IMAGE: ghcr.io/${{ github.repository_owner }}/aegis-agent-platform
  OPERATOR_IMAGE: ghcr.io/${{ github.repository_owner }}/aegis-operator-ui

jobs:
  verify:
    name: Reproducible build, SBOM, vulnerabilities, secrets, and licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.10.0"
      - name: Install pinned package manager
        run: npm install --global pnpm@11.21.0
      - name: Install project
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
          mkdir -p .aegis-evidence
      - name: Enforce dependency license policy
        run: |
          python scripts/check_license_policy.py
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend license:check
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: tonistiigi/binfmt:qemu-v9.2.2@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build application image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          tags: aegis-agent-platform:ci
          provenance: false
      - name: Build operator image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          load: true
          platforms: linux/amd64
          push: false
          tags: aegis-operator-ui:ci
          provenance: false
      - name: Generate application SPDX SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: aegis-agent-platform:ci
          format: spdx-json
          output-file: .aegis-evidence/aegis-agent-platform.spdx.json
          upload-artifact: false
      - name: Generate operator SPDX SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: aegis-operator-ui:ci
          format: spdx-json
          output-file: .aegis-evidence/aegis-operator-ui.spdx.json
          upload-artifact: false
      - name: Scan application vulnerabilities
        uses: anchore/scan-action@df395807f4554463d4455b8047cf58e37b6acaae # v6.5.0
        with:
          image: aegis-agent-platform:ci
          grype-version: v0.117.0
          severity-cutoff: high
          fail-build: false
          only-fixed: false
          output-format: json
          output-file: .aegis-evidence/aegis-agent-platform-linux-amd64.grype.json
      - name: Scan operator vulnerabilities
        uses: anchore/scan-action@df395807f4554463d4455b8047cf58e37b6acaae # v6.5.0
        with:
          image: aegis-operator-ui:ci
          grype-version: v0.117.0
          severity-cutoff: high
          fail-build: false
          only-fixed: false
          output-format: json
          output-file: .aegis-evidence/aegis-operator-ui-linux-amd64.grype.json
      - name: Enforce vulnerability and waiver policy
        run: |
          python scripts/check_vulnerability_policy.py \
            --report aegis-agent-platform/linux-amd64=.aegis-evidence/aegis-agent-platform-linux-amd64.grype.json \
            --report aegis-operator-ui/linux-amd64=.aegis-evidence/aegis-operator-ui-linux-amd64.grype.json \
            --output .aegis-evidence/vulnerability-policy.json
      - name: Scan repository secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
          hide-progress: true
      - name: Retain bounded supply-chain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-reports
          path: .aegis-evidence/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Multi-arch publish, attest, and keyless sign
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: tonistiigi/binfmt:qemu-v9.2.2@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create evidence directory
        run: mkdir -p .aegis-evidence
      - name: Publish application
        id: application
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.APPLICATION_IMAGE }}:sha-${{ github.sha }}
          provenance: false
      - name: Publish operator
        id: operator
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.OPERATOR_IMAGE }}:sha-${{ github.sha }}
          provenance: false
      - name: Resolve exact platform digests
        id: platforms
        env:
          APPLICATION_DIGEST: ${{ steps.application.outputs.digest }}
          OPERATOR_DIGEST: ${{ steps.operator.outputs.digest }}
        run: |
          application_manifest="$(docker buildx imagetools inspect --raw "${APPLICATION_IMAGE}@${APPLICATION_DIGEST}")"
          operator_manifest="$(docker buildx imagetools inspect --raw "${OPERATOR_IMAGE}@${OPERATOR_DIGEST}")"
          application_amd64="$(jq --raw-output '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<<"${application_manifest}")"
          application_arm64="$(jq --raw-output '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' <<<"${application_manifest}")"
          operator_amd64="$(jq --raw-output '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<<"${operator_manifest}")"
          operator_arm64="$(jq --raw-output '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' <<<"${operator_manifest}")"
          for digest in "${application_amd64}" "${application_arm64}" "${operator_amd64}" "${operator_arm64}"; do
            printf '%s\n' "${digest}" | grep --extended-regexp --quiet '^sha256:[0-9a-f]{64}$'
          done
          {
            echo "application_amd64=${application_amd64}"
            echo "application_arm64=${application_arm64}"
            echo "operator_amd64=${operator_amd64}"
            echo "operator_arm64=${operator_arm64}"
          } >> "${GITHUB_OUTPUT}"
      - name: Scan published application amd64
        uses: anchore/scan-action@df395807f4554463d4455b8047cf58e37b6acaae # v6.5.0
        with:
          image: ${{ env.APPLICATION_IMAGE }}@${{ steps.platforms.outputs.application_amd64 }}
          severity-cutoff: high
          fail-build: false
          only-fixed: false
          output-format: json
          output-file: .aegis-evidence/aegis-agent-platform-linux-amd64.grype.json
      - name: Scan published application arm64
        uses: anchore/scan-action@df395807f4554463d4455b8047cf58e37b6acaae # v6.5.0
        with:
          image: ${{ env.APPLICATION_IMAGE }}@${{ steps.platforms.outputs.application_arm64 }}
          severity-cutoff: high
          fail-build: false
          only-fixed: false
          output-format: json
          output-file: .aegis-evidence/aegis-agent-platform-linux-arm64.grype.json
      - name: Scan published operator amd64
        uses: anchore/scan-action@df395807f4554463d4455b8047cf58e37b6acaae # v6.5.0
        with:
          image: ${{ env.OPERATOR_IMAGE }}@${{ steps.platforms.outputs.operator_amd64 }}
          severity-cutoff: high
          fail-build: false
          only-fixed: false
          output-format: json
          output-file: .aegis-evidence/aegis-operator-ui-linux-amd64.grype.json
      - name: Scan published operator arm64
        uses: anchore/scan-action@df395807f4554463d4455b8047cf58e37b6acaae # v6.5.0
        with:
          image: ${{ env.OPERATOR_IMAGE }}@${{ steps.platforms.outputs.operator_arm64 }}
          severity-cutoff: high
          fail-build: false
          only-fixed: false
          output-format: json
          output-file: .aegis-evidence/aegis-operator-ui-linux-arm64.grype.json
      - name: Enforce published-platform vulnerability policy
        run: |
          python scripts/check_vulnerability_policy.py \
            --report aegis-agent-platform/linux-amd64=.aegis-evidence/aegis-agent-platform-linux-amd64.grype.json \
            --report aegis-agent-platform/linux-arm64=.aegis-evidence/aegis-agent-platform-linux-arm64.grype.json \
            --report aegis-operator-ui/linux-amd64=.aegis-evidence/aegis-operator-ui-linux-amd64.grype.json \
            --report aegis-operator-ui/linux-arm64=.aegis-evidence/aegis-operator-ui-linux-arm64.grype.json \
            --output .aegis-evidence/vulnerability-policy.json
      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Generate application amd64 SPDX SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: ${{ env.APPLICATION_IMAGE }}@${{ steps.platforms.outputs.application_amd64 }}
          format: spdx-json
          output-file: .aegis-evidence/aegis-agent-platform-linux-amd64.spdx.json
          upload-artifact: false
      - name: Generate application arm64 SPDX SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: ${{ env.APPLICATION_IMAGE }}@${{ steps.platforms.outputs.application_arm64 }}
          format: spdx-json
          output-file: .aegis-evidence/aegis-agent-platform-linux-arm64.spdx.json
          upload-artifact: false
      - name: Generate operator amd64 SPDX SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: ${{ env.OPERATOR_IMAGE }}@${{ steps.platforms.outputs.operator_amd64 }}
          format: spdx-json
          output-file: .aegis-evidence/aegis-operator-ui-linux-amd64.spdx.json
          upload-artifact: false
      - name: Generate operator arm64 SPDX SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: ${{ env.OPERATOR_IMAGE }}@${{ steps.platforms.outputs.operator_arm64 }}
          format: spdx-json
          output-file: .aegis-evidence/aegis-operator-ui-linux-arm64.spdx.json
          upload-artifact: false
      - name: Build cryptographically bound index SBOMs
        env:
          APPLICATION_DIGEST: ${{ steps.application.outputs.digest }}
          APPLICATION_AMD64: ${{ steps.platforms.outputs.application_amd64 }}
          APPLICATION_ARM64: ${{ steps.platforms.outputs.application_arm64 }}
          OPERATOR_DIGEST: ${{ steps.operator.outputs.digest }}
          OPERATOR_AMD64: ${{ steps.platforms.outputs.operator_amd64 }}
          OPERATOR_ARM64: ${{ steps.platforms.outputs.operator_arm64 }}
        run: |
          created="$(git show --no-patch --format=%cI HEAD)"
          python scripts/build_spdx_index.py \
            --name aegis-agent-platform \
            --image "${APPLICATION_IMAGE}" \
            --index-digest "${APPLICATION_DIGEST}" \
            --created "${created}" \
            --platform "linux/amd64=.aegis-evidence/aegis-agent-platform-linux-amd64.spdx.json=${APPLICATION_AMD64}" \
            --platform "linux/arm64=.aegis-evidence/aegis-agent-platform-linux-arm64.spdx.json=${APPLICATION_ARM64}" \
            --output .aegis-evidence/aegis-agent-platform-index.spdx.json
          python scripts/build_spdx_index.py \
            --name aegis-operator-ui \
            --image "${OPERATOR_IMAGE}" \
            --index-digest "${OPERATOR_DIGEST}" \
            --created "${created}" \
            --platform "linux/amd64=.aegis-evidence/aegis-operator-ui-linux-amd64.spdx.json=${OPERATOR_AMD64}" \
            --platform "linux/arm64=.aegis-evidence/aegis-operator-ui-linux-arm64.spdx.json=${OPERATOR_ARM64}" \
            --output .aegis-evidence/aegis-operator-ui-index.spdx.json
      - name: Keyless-sign immutable digests
        env:
          APPLICATION_DIGEST: ${{ steps.application.outputs.digest }}
          OPERATOR_DIGEST: ${{ steps.operator.outputs.digest }}
        run: |
          cosign sign --yes --registry-referrers-mode oci-1-1 \
            "${APPLICATION_IMAGE}@${APPLICATION_DIGEST}"
          cosign sign --yes --registry-referrers-mode oci-1-1 \
            "${OPERATOR_IMAGE}@${OPERATOR_DIGEST}"
      - name: Attest application provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ${{ env.APPLICATION_IMAGE }}
          subject-digest: ${{ steps.application.outputs.digest }}
          push-to-registry: true
      - name: Attest operator provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ${{ env.OPERATOR_IMAGE }}
          subject-digest: ${{ steps.operator.outputs.digest }}
          push-to-registry: true
      - name: Attest application index SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.APPLICATION_IMAGE }}
          subject-digest: ${{ steps.application.outputs.digest }}
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: .aegis-evidence/aegis-agent-platform-index.spdx.json
          push-to-registry: true
      - name: Attest application amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.APPLICATION_IMAGE }}
          subject-digest: ${{ steps.platforms.outputs.application_amd64 }}
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: .aegis-evidence/aegis-agent-platform-linux-amd64.spdx.json
          push-to-registry: true
      - name: Attest application arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.APPLICATION_IMAGE }}
          subject-digest: ${{ steps.platforms.outputs.application_arm64 }}
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: .aegis-evidence/aegis-agent-platform-linux-arm64.spdx.json
          push-to-registry: true
      - name: Attest operator index SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.OPERATOR_IMAGE }}
          subject-digest: ${{ steps.operator.outputs.digest }}
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: .aegis-evidence/aegis-operator-ui-index.spdx.json
          push-to-registry: true
      - name: Attest operator amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.OPERATOR_IMAGE }}
          subject-digest: ${{ steps.platforms.outputs.operator_amd64 }}
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: .aegis-evidence/aegis-operator-ui-linux-amd64.spdx.json
          push-to-registry: true
      - name: Attest operator arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.OPERATOR_IMAGE }}
          subject-digest: ${{ steps.platforms.outputs.operator_arm64 }}
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: .aegis-evidence/aegis-operator-ui-linux-arm64.spdx.json
          push-to-registry: true
      - name: Retain bounded published-artifact evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-platform-supply-chain-reports
          path: .aegis-evidence/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
