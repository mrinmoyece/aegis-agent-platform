name: Restore drill

on:
  pull_request:
    paths:
      - ".github/workflows/restore-drill.yml"
      - "migrations/**"
      - "scripts/restore_drill.sh"
      - "scripts/restore_redrive.py"
      - "scripts/migrate.py"
      - "tests/test_production_foundations.py"
  push:
    branches: [master]
  schedule:
    - cron: "41 4 * * 2"

permissions:
  contents: read

concurrency:
  group: restore-drill-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore:
    name: Isolated ledger restore and derived-state rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install hash-locked migration runtime
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Run deterministic containerized restore drill
        run: make restore-drill
      - name: Retain bounded integrity report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: restore-drill-report
          path: .aegis-evidence/restore-drill.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
