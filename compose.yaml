name: aegis-agent-platform

services:
  operator-ui:
    profiles: ["operator-demo"]
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${AEGIS_OPERATOR_UI_PORT:-4173}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - operator-ui

  api:
    build:
      context: .
      target: runtime
    environment:
      AEGIS_ENVIRONMENT: development
      AEGIS_SERVICE_NAME: aegis-control-plane
      AEGIS_HOST: 0.0.0.0
      AEGIS_PORT: 8080
      AEGIS_LOG_LEVEL: ${AEGIS_LOG_LEVEL:-INFO}
      AEGIS_DATABASE_URL: postgresql://aegis_runtime:${AEGIS_POSTGRES_APP_PASSWORD}@postgres:5432/${AEGIS_POSTGRES_DB}
      AEGIS_REDIS_URL: redis://redis:6379/0
      AEGIS_REDIS_MAX_CONNECTIONS: "32"
      AEGIS_REDIS_CONNECT_TIMEOUT_SECONDS: "2"
      AEGIS_REDIS_SOCKET_TIMEOUT_SECONDS: "5"
      AEGIS_WORKER_MAX_CONCURRENCY: "16"
      AEGIS_WORKER_LEASE_SECONDS: "30"
      AEGIS_WORKER_HEARTBEAT_SECONDS: "10"
      AEGIS_OIDC_ISSUER: http://localhost:${AEGIS_KEYCLOAK_PORT:-8081}/realms/aegis
      AEGIS_OIDC_JWKS_URL: http://keycloak:8080/realms/aegis/protocol/openid-connect/certs
      AEGIS_OIDC_AUDIENCE: aegis-control-plane
      AEGIS_OIDC_CLOCK_SKEW_SECONDS: "30"
      AEGIS_WRITER_FENCES_FILE: /var/run/secrets/aegis/writer-fences.json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: aegis-control-plane
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=development,service.namespace=aegis
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${AEGIS_TELEMETRY_SAMPLE_RATE:-0.10}
      OTEL_BSP_MAX_QUEUE_SIZE: ${AEGIS_TELEMETRY_BUFFER_CAPACITY:-4096}
      OTEL_BSP_EXPORT_TIMEOUT: ${AEGIS_TELEMETRY_EXPORT_TIMEOUT_MS:-2000}
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
    ports:
      - "127.0.0.1:${AEGIS_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      otel-collector:
        condition: service_started
    read_only: true
    volumes:
      - ./docker/local-writer-fences.json:/var/run/secrets/aegis/writer-fences.json:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - backend
      - telemetry

  migration:
    build:
      context: .
      target: runtime
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        python /opt/aegis/scripts/migrate.py
        --applied-by local-compose
        --adopt-existing
        && python /opt/aegis/scripts/bootstrap_local_compose.py
    environment:
      AEGIS_ENVIRONMENT: development
      AEGIS_MIGRATION_DATABASE_URL: postgresql://${AEGIS_POSTGRES_USER}:${AEGIS_POSTGRES_PASSWORD}@postgres:5432/${AEGIS_POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    networks:
      - backend

  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: ${AEGIS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AEGIS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AEGIS_POSTGRES_DB}
      AEGIS_POSTGRES_APP_PASSWORD: ${AEGIS_POSTGRES_APP_PASSWORD}
    ports:
      - "127.0.0.1:${AEGIS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./migrations/0001_identity_governance.sql:/docker-entrypoint-initdb.d/20-identity-governance.sql:ro
      - ./migrations/0002_durable_ledger.sql:/docker-entrypoint-initdb.d/30-durable-ledger.sql:ro
      - ./migrations/0003_distributed_worker_runtime.sql:/docker-entrypoint-initdb.d/35-worker-runtime.sql:ro
      - ./migrations/0004_model_gateway.sql:/docker-entrypoint-initdb.d/37-model-gateway.sql:ro
      - ./migrations/0005_evidence_connectors.sql:/docker-entrypoint-initdb.d/38-evidence-connectors.sql:ro
      - ./migrations/0006_specialist_orchestration.sql:/docker-entrypoint-initdb.d/39-specialist-orchestration.sql:ro
      - ./migrations/0007_remediation_approvals.sql:/docker-entrypoint-initdb.d/39z-remediation-approvals.sql:ro
      - ./migrations/0008_hardened_sandbox_execution.sql:/docker-entrypoint-initdb.d/39zz-hardened-sandbox-execution.sql:ro
      - ./migrations/0009_event_grounded_memory_pgvector.sql:/docker-entrypoint-initdb.d/39zzz-event-grounded-memory-pgvector.sql:ro
      - ./migrations/0010_mcp_a2a_interoperability.sql:/docker-entrypoint-initdb.d/39zzzz-mcp-a2a-interoperability.sql:ro
      - ./docker/postgres/40-create-app-user.sh:/docker-entrypoint-initdb.d/40-create-app-user.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --timeout
      - "5"
      - --tcp-keepalive
      - "60"
    ports:
      - "127.0.0.1:${AEGIS_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:26.3@sha256:357829ec7c4693397533035092ad13b0644bcc95ded311f33a3738c4d9e9bdba
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${AEGIS_KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${AEGIS_KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${AEGIS_POSTGRES_USER}
      KC_DB_PASSWORD: ${AEGIS_POSTGRES_PASSWORD}
      KC_HOSTNAME: http://localhost:${AEGIS_KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
      JAVA_OPTS_KC_HEAP: -Xms64m -Xmx256m -XX:MaxMetaspaceSize=192m
    ports:
      - "127.0.0.1:${AEGIS_KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./deploy/keycloak/realm-aegis.json:/opt/keycloak/data/import/realm-aegis.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1@sha256:9c247564e65ca19f97d891cca19a1a8d291ce631b890885b44e3503c5fdb3895
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${AEGIS_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${AEGIS_OTLP_HTTP_PORT:-4318}:4318"
    healthcheck:
      test:
        - CMD
        - /otelcol-contrib
        - validate
        - --config=/etc/otelcol-contrib/config.yaml
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - telemetry

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${AEGIS_PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped
    networks:
      - telemetry

  grafana:
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    environment:
      GF_SECURITY_ADMIN_USER: ${AEGIS_GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${AEGIS_GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${AEGIS_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - telemetry

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  backend:
  operator-ui:
  telemetry:
